  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"ko\"><head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>JCodeQuest 발표<\u002Ftitle>\n<style>/* ============================================================================\n   JCodeQuest — Colors & Type\n   Source of truth: JBNU-CILAB/JCodeQuest  frontend/src/index.css (@theme block)\n   plus values lifted from Tailwind utility usage across components.\n\n   JCodeQuest pairs a clean \"Toss-style\" fintech app surface (white cards,\n   toss-blue accent, soft grey text scale) with a retro pixel / terminal\n   register (NeoDunggeunmo pixel font, monospace leaderboard, matrix code-rain).\n   The pixel font is the GLOBAL body font; clean layout keeps app pages legible.\n   ============================================================================ */\n\n@font-face {\n  font-family: 'NeoDunggeunmo';\n  src: url(\"2efa0183-fda7-4d13-bcc6-f44ce2949a85\") format('woff2');\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n\n:root {\n  /* ---- Brand (Toss-blue) ---------------------------------------------- */\n  --brand:          #3182F6;   /* primary action, links, accents          */\n  --brand-dark:     #1b64da;   /* hover / pressed primary                 */\n  --brand-soft:     #e8f0fe;   /* tinted fills, outline-button hover bg    */\n  --brand-tint:     #7aa9f7;   /* lighter blue used in gradients/preview   */\n\n  /* ---- Header / deep blues -------------------------------------------- */\n  --header-1:       #2b4a7c;\n  --header-2:       #1e3a64;\n\n  /* ---- Surfaces ------------------------------------------------------- */\n  --page:           #f4f6fa;   /* app background                           */\n  --surface:        #ffffff;   /* cards, header bar                        */\n  --surface-tint:   #fafaf7;   /* podium block fill (warm off-white)       */\n\n  /* ---- Foreground / text ---------------------------------------------- */\n  --fg1:            #1f2937;   /* body text (gray-800/900)                 */\n  --fg2:            #374151;   /* strong secondary                         */\n  --muted:          #6b7280;   /* labels, secondary text (gray-500)        */\n  --muted-soft:     #9ca3af;   /* tertiary / placeholder (gray-400)        */\n\n  /* ---- Hairlines ------------------------------------------------------ */\n  --line:           #e5e7eb;   /* default border                          */\n  --line-soft:      #f1f3f7;   /* faint divider                           */\n\n  /* ---- Decorative scene (intro / streak / podium) --------------------- */\n  --sky-1:          #b6e0f7;\n  --sky-2:          #d6eef9;\n  --grass-1:        #a7d893;\n  --grass-2:        #7ec46f;\n\n  /* ---- Matrix code-rain backdrop -------------------------------------- */\n  --rain-fall:      #2b3a4a;   /* falling glyphs (dark blue-grey)          */\n  --rain-rise:      #1b64da;   /* rising glyphs (toss-blue)                */\n\n  /* ---- Streak \"grass\" (GitHub-style grid — note: BLUE, not green) ------ */\n  --streak-0:       #e5e7eb;   /* gray-200  (no activity)                  */\n  --streak-1:       #bfdbfe;   /* blue-200                                 */\n  --streak-2:       #60a5fa;   /* blue-400                                 */\n  --streak-3:       #2563eb;   /* blue-600                                 */\n  --streak-4:       #1e40af;   /* blue-800  (most activity)                */\n\n  /* ---- Semantic / status ---------------------------------------------- */\n  --ac:             #3182F6;   /* Accepted — blue (NOT the usual green)    */\n  --ac-bg:          #eff6ff;   /* blue-50                                  */\n  --sus:            #f43f5e;   /* Suspect / Wrong — rose-500               */\n  --sus-bg:         #fff1f2;   /* rose-50                                  */\n  --warn:           #b45309;   /* amber-700 text (api-key / profile nags)  */\n  --warn-bg:        #fffbeb;   /* amber-50 0.25);\n}\n\n/* ============================================================================\n   Base elements\n   ============================================================================ */\n\nbody {\n  font-family: var(--font-pixel);\n  background: var(--page);\n  color: var(--fg1);\n  -webkit-font-smoothing: antialiased;\n}\n\n/* ---- Semantic type scale (lifted from page headers / cards) ----------- */\n\n.h1 {            /* page title — e.g. \"문제 목록\" */\n  font-size: 28px;\n  font-weight: 800;\n  letter-spacing: -0.01em;\n  color: var(--fg1);\n  line-height: 1.2;\n}\n\n.h1-hero {       /* terminal hero title — \"LEADERBOARD\" */\n  font-size: clamp(28px, 4vw, 40px);\n  font-weight: 800;\n  letter-spacing: 0.25em;\n  color: var(--brand);\n  font-family: var(--font-mono);\n}\n\n.h2 {            /* week / section header */\n  font-size: 20px;\n  font-weight: 800;\n  letter-spacing: 0.02em;\n  color: var(--fg1);\n}\n\n.card-title {    /* card heading */\n  font-size: 15px;\n  font-weight: 700;\n  color: var(--fg2);\n}\n\n.p {             /* body copy */\n  font-size: 13.5px;\n  font-weight: 400;\n  line-height: 1.65;\n  color: var(--fg2);\n  text-wrap: pretty;\n}\n\n.small {         /* labels, meta */\n  font-size: 12px;\n  color: var(--muted);\n}\n\n.tiny {          /* badge / hint text */\n  font-size: 11px;\n  color: var(--muted);\n}\n\n.code {          /* inline + block code, terminal */\n  font-family: var(--font-mono);\n  font-size: 12.5px;\n}\n\n.label-caps {    /* INPUT #1, SCORE, PREVIEW — tracked uppercase labels */\n  font-size: 10px;\n  font-weight: 600;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--muted);\n}\n\n/* tabular numerals used everywhere points/XP/time appear */\n.num { font-variant-numeric: tabular-nums; }\n<\u002Fstyle>\n<style>\n  deck-stage:not(:defined) { visibility: hidden; }\n\n  :root {\n    --type-display: 120px;\n    --type-title:   64px;\n    --type-subtitle:44px;\n    --type-lead:    38px;\n    --type-body:    32px;\n    --type-small:   26px;\n    --type-micro:   24px;\n    --pad-x: 120px;\n    --pad-top: 96px;\n    --pad-bottom: 88px;\n    --gap-title: 44px;\n    --gap-item: 26px;\n  }\n\n  * { box-sizing: border-box; }\n  html, body { margin: 0; padding: 0; background: #0d1117; }\n\n  deck-stage section {\n    display: flex;\n    flex-direction: column;\n    padding: var(--pad-top) var(--pad-x) var(--pad-bottom);\n    background: var(--page);\n    color: var(--fg1);\n    font-family: var(--font-pixel);\n    overflow: hidden;\n  }\n  deck-stage section.s-white { background: var(--surface); }\n\n  /* ---- shared ---- */\n  .eyebrow {\n    font-family: var(--font-mono);\n    font-size: var(--type-micro);\n    font-weight: 600;\n    letter-spacing: 0.22em;\n    text-transform: uppercase;\n    color: var(--brand);\n    display: flex;\n    align-items: center;\n    gap: 16px;\n  }\n  .eyebrow::before { content: \"\"; width: 40px; height: 3px; background: var(--brand); border-radius: 2px; }\n  .s-title { font-size: var(--type-title); font-weight: 800; letter-spacing: -0.01em; line-height: 1.1; margin: 0; color: var(--fg1); }\n  .lead { font-size: var(--type-lead); line-height: 1.5; color: var(--fg2); margin: 0; text-wrap: pretty; }\n  .muted { color: var(--muted); }\n  .brand { color: var(--brand); }\n  .mono  { font-family: var(--font-mono); }\n  .num   { font-variant-numeric: tabular-nums; }\n\n  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); box-shadow: var(--shadow-card); }\n\n  .slug { position: absolute; bottom: 40px; left: var(--pad-x); font-family: var(--font-mono); font-size: 24px; letter-spacing: 0.12em; color: var(--muted-soft); text-transform: uppercase; }\n  .pageno { position: absolute; bottom: 40px; right: var(--pad-x); font-family: var(--font-mono); font-size: 24px; color: var(--muted-soft); letter-spacing: 0.1em; }\n\n  .head { display: flex; flex-direction: column; gap: 18px; margin-bottom: var(--gap-title); }\n\n  /* ===== COVER ===== */\n  .cover { justify-content: center; align-items: center; text-align: center; gap: 0; position: relative; }\n  .cover-inner { max-width: 1500px; }\n  .team-line { margin-top: 40px; font-family: var(--font-mono); font-size: 40px; color: var(--muted); letter-spacing: 0.06em; }\n  .event-line { margin-top: 14px; font-family: var(--font-mono); font-size: 26px; color: var(--muted-soft); letter-spacing: 0.08em; }\n  .cover-wordmark { font-size: var(--type-display); font-weight: 800; letter-spacing: -0.02em; line-height: 0.98; margin: 30px 0 0; }\n  .cover-wordmark .q { color: var(--brand); }\n  .cover-tag { font-size: var(--type-subtitle); color: var(--fg2); margin: 30px 0 0; line-height: 1.32; }\n  .cover-tag .en { color: var(--muted); font-size: var(--type-body); display: block; margin-top: 12px; font-family: var(--font-mono); letter-spacing: 0.02em; }\n  .cmd { margin-top: 46px; display: inline-flex; align-items: center; gap: 14px; white-space: nowrap; background: #0f1b2d; border: 1px solid #1d2c44; border-radius: var(--r-md); padding: 18px 26px; font-family: var(--font-mono); font-size: var(--type-small); color: #cfe0ff; }\n  .cmd .dollar { color: var(--brand-tint); }\n  .cmd .cursor { width: 13px; height: 28px; background: var(--brand); display: inline-block; animation: blink 1.1s steps(1) infinite; margin-left: 2px; }\n  @keyframes blink { 50% { opacity: 0; } }\n  .cover-strengths { display: flex; gap: 18px; margin-top: 44px; flex-wrap: wrap; }\n  .chip { display: inline-flex; align-items: center; gap: 10px; background: var(--brand-soft); color: var(--brand-dark); border-radius: var(--r-pill); padding: 13px 26px; font-family: var(--font-mono); font-size: var(--type-small); font-weight: 600; letter-spacing: 0.02em; }\n\n  /* ===== BACKGROUND ===== */\n  .prob-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; flex: 1; }\n  .prob-card { padding: 44px 40px; display: flex; flex-direction: column; gap: 22px; }\n  .prob-num { font-family: var(--font-mono); font-size: 30px; color: var(--brand); font-weight: 700; letter-spacing: 0.1em; }\n  .prob-h { font-size: var(--type-subtitle); font-weight: 800; line-height: 1.2; margin: 0; }\n  .prob-p { font-size: var(--type-small); line-height: 1.55; color: var(--muted); margin: 0; }\n\n  /* ===== SOLUTION ===== */\n  .sol { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 60px; }\n  .sol-statement { font-size: 56px; font-weight: 800; line-height: 1.32; letter-spacing: -0.01em; max-width: 1560px; }\n  .sol-statement .hl { color: var(--brand); }\n  .pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }\n  .pillar { padding: 36px 38px; display: flex; flex-direction: column; gap: 16px; }\n  .pillar .k { font-family: var(--font-mono); font-size: var(--type-micro); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted-soft); }\n  .pillar .t { font-size: 34px; font-weight: 800; }\n  .pillar .d { font-size: 24px; color: var(--muted); line-height: 1.5; }\n\n  /* ===== JOURNEY ===== */\n  .flow { flex: 1; display: flex; align-items: center; }\n  .flow-row { display: flex; align-items: stretch; gap: 0; width: 100%; }\n  .step { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 0 8px; }\n  .step-badge { width: 64px; height: 64px; border-radius: var(--r-pill); background: var(--brand-soft); color: var(--brand-dark); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-weight: 700; font-size: 26px; }\n  .step-t { font-size: 28px; font-weight: 800; line-height: 1.2; }\n  .step-d { font-size: 24px; color: var(--muted); line-height: 1.4; }\n  .arrow { display: flex; align-items: center; color: var(--brand-tint); font-size: 40px; padding: 0 6px; align-self: flex-start; margin-top: 12px; }\n  .step.accent .step-badge { background: var(--brand); color: #fff; }\n\n  /* ===== AI ENSEMBLE ===== */\n  .magi { display: grid; grid-template-columns: repeat(3,1fr); gap: 26px; }\n  .judge { padding: 38px 34px; display: flex; flex-direction: column; gap: 18px; position: relative; }\n  .judge .nm { font-family: var(--font-mono); font-size: 32px; font-weight: 700; letter-spacing: 0.02em; }\n  .judge .role { font-size: 24px; color: var(--muted); line-height: 1.45; }\n  .vote { align-self: flex-start; margin-top: auto; display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; border-radius: var(--r-pill); padding: 9px 22px; font-family: var(--font-mono); font-weight: 700; font-size: 25px; }\n  .vote.ac { background: var(--ac-bg); color: var(--ac); }\n  .vote.sus { background: var(--sus-bg); color: var(--sus); }\n  .proc { margin-top: 36px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }\n  .proc-step { font-family: var(--font-mono); font-size: var(--type-small); color: var(--fg2); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-pill); padding: 15px 30px; box-shadow: var(--shadow-card); }\n  .proc-arrow { color: var(--brand-tint); font-size: 32px; }\n  .tutor-note { margin-top: 28px; display: flex; align-items: center; gap: 20px; }\n  .tutor-d { font-size: var(--type-small); color: var(--muted); line-height: 1.45; }\n\n  /* ===== LLM-as-JUDGE SAFEGUARDS ===== */\n  .guard { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }\n  .guard-card { padding: 40px 38px; display: flex; flex-direction: column; gap: 18px; }\n  .g-h { font-size: 34px; font-weight: 800; }\n  .g-d { font-size: 24px; color: var(--muted); line-height: 1.5; }\n  .meter { height: 16px; border-radius: 999px; background: var(--line); overflow: hidden; margin-top: auto; }\n  .meter-fill { height: 100%; border-radius: 999px; }\n  .g-meta { font-family: var(--font-mono); font-size: 24px; }\n  .logbox { margin-top: auto; background: #0f1b2d; border: 1px solid #1d2c44; border-radius: var(--r-md); padding: 22px 24px; color: #cfe0ff; font-family: var(--font-mono); font-size: 24px; line-height: 1.7; }\n  .logbox .ok { color: var(--brand-tint); }\n  .logbox .bad { color: #fb7185; }\n\n  /* ===== DIFFICULTY DISTRIBUTION ===== */\n  .dist { flex: 1; display: flex; flex-direction: column; gap: 36px; }\n  .legend { display: flex; gap: 40px; }\n  .lg { display: flex; align-items: center; gap: 14px; font-family: var(--font-mono); font-size: var(--type-small); color: var(--fg2); }\n  .lg .swatch { width: 26px; height: 26px; border-radius: 7px; }\n  .lg b { font-weight: 700; }\n  .lg .share { color: var(--muted); }\n  .chart { flex: 1; display: flex; align-items: flex-end; gap: 26px; padding: 0 10px; border-bottom: 3px solid var(--line); }\n  .wk { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 16px; }\n  .bars { display: flex; align-items: flex-end; justify-content: center; gap: 9px; width: 100%; height: 100%; }\n  .bar { width: 28px; border-radius: 7px 7px 0 0; }\n  .wk-label { font-family: var(--font-mono); font-size: 24px; color: var(--muted); }\n\n  /* ===== AUTHORING ENGINE ===== */\n  .auth { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 56px; }\n  .pipe { display: flex; align-items: flex-start; justify-content: space-between; }\n  .node { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }\n  .node .dot { width: 62px; height: 62px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-dark); display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-weight: 700; font-size: 26px; }\n  .node.key .dot { background: var(--brand); color: #fff; box-shadow: 0 6px 16px -6px rgba(49,130,246,.5); }\n  .node .nl { font-size: 26px; font-weight: 800; }\n  .pl-arrow { align-self: flex-start; margin-top: 20px; color: var(--brand-tint); font-size: 26px; }\n  .auth-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 26px; }\n  .auth-card { padding: 36px 38px; display: flex; flex-direction: column; gap: 14px; }\n  .auth-card .ac-k { font-family: var(--font-mono); font-size: var(--type-micro); letter-spacing: 0.14em; text-transform: uppercase; color: var(--brand); }\n  .auth-card .ac-t { font-size: 32px; font-weight: 800; }\n  .auth-card .ac-d { font-size: 24px; color: var(--muted); line-height: 1.5; }\n\n  /* ===== ARCHITECTURE ===== */\n  .arch { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 30px; }\n  .arch-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 26px; }\n  .svc { padding: 36px 40px; display: flex; flex-direction: column; gap: 14px; border-left: 4px solid var(--brand); }\n  .svc .layer { font-family: var(--font-mono); font-size: var(--type-micro); letter-spacing: 0.14em; text-transform: uppercase; color: var(--brand); }\n  .svc .nm { font-size: 32px; font-weight: 800; }\n  .svc .stk { font-family: var(--font-mono); font-size: 24px; color: var(--muted-soft); }\n  .svc .d { font-size: 24px; color: var(--muted); line-height: 1.45; }\n\n  /* ===== ROADMAP ===== */\n  .road { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; }\n  .road-row { padding: 34px 0; border-top: 1px solid var(--line); }\n  .road-row:last-child { border-bottom: 1px solid var(--line); }\n  .road-phase { font-family: var(--font-mono); font-size: 24px; font-weight: 700; color: var(--brand); letter-spacing: 0.06em; padding-top: 6px; }\n  .road-phase small { display: block; color: var(--muted-soft); font-weight: 500; font-size: 24px; margin-top: 8px; letter-spacing: 0.04em; }\n  .road-items { display: flex; flex-direction: column; gap: 12px; }\n  .road-h { font-size: 32px; font-weight: 800; }\n  .road-d { font-size: 24px; color: var(--muted); line-height: 1.5; }\n\n  /* ===== CLOSING ===== */\n  .close { justify-content: center; align-items: center; text-align: center; gap: 0; position: relative; }\n  .close-h { font-size: 96px; font-weight: 800; letter-spacing: -0.01em; margin: 0; }\n  .close-h .q { color: var(--brand); }\n  .close-sub { font-size: var(--type-lead); color: var(--fg2); margin: 26px 0 0; }\n  .close-repo { margin-top: 40px; font-family: var(--font-mono); font-size: var(--type-small); color: var(--muted); letter-spacing: 0.04em; }\n  .close-team { margin-top: 12px; font-family: var(--font-mono); font-size: var(--type-micro); color: var(--muted-soft); letter-spacing: 0.1em; text-transform: uppercase; }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<deck-stage width=\"1920\" height=\"1080\">\n\n  <!-- 1 · COVER -->\n  <section data-label=\"표지\" class=\"cover s-white\">\n    <div class=\"cover-inner\">\n      <h1 class=\"cover-wordmark\">J<span class=\"q\">CodeQuest<\u002Fspan><\u002Fh1>\n      <div class=\"team-line\">CodeQuest 팀<\u002Fdiv>\n      <div class=\"event-line\">전북대학교 AI SW경진대회<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"pageno num\">01 / 09<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 2 · BACKGROUND -->\n  <section data-label=\"배경\">\n    <div class=\"head\">\n      <div class=\"eyebrow\">Background<\u002Fdiv>\n      <h2 class=\"s-title\">왜 만들었나<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"prob-grid\">\n      <div class=\"card prob-card\">\n        <div class=\"prob-num\">01<\u002Fdiv>\n        <h3 class=\"prob-h\">채점의<br>사각지대<\u002Fh3>\n        <p class=\"prob-p\">테스트를 통과해도 의도에 맞는 풀이인지, 표절·AI 생성 코드는 아닌지 알 수 없습니다.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card prob-card\">\n        <div class=\"prob-num\">02<\u002Fdiv>\n        <h3 class=\"prob-h\">들쪽날쪽한<br>난이도 분포<\u002Fh3>\n        <p class=\"prob-p\">주차마다 난이도가 쇏리면 학습 곡선이 무너지고 따라가기 어려워집니다.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"card prob-card\">\n        <div class=\"prob-num\">03<\u002Fdiv>\n        <h3 class=\"prob-h\">막혀도<br>튜터가 없다<\u002Fh3>\n        <p class=\"prob-p\">어디서 틀렸는지, 다음엔 무엇을 해야 할지 짚어줄 튜터가 없습니다.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"slug\">JCodeQuest<\u002Fdiv>\n    <div class=\"pageno num\">02 / 09<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 3 · SOLUTION -->\n  <section data-label=\"솔루션\" class=\"s-white\">\n    <div class=\"head\">\n      <div class=\"eyebrow\">Solution<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sol\">\n      <p class=\"sol-statement\">정답을 넘어 풀이의 <span class=\"hl\">의도까지 검증<\u002Fspan>하고,<br>난이도를 <span class=\"hl\">고르게<\u002Fspan> 설계한 알고리즘 학습·채점 플랫폼.<\u002Fp>\n      <div class=\"pillars\">\n        <div class=\"card pillar\">\n          <div class=\"k\">Verify<\u002Fdiv>\n          <div class=\"t\">의도까지 검증<\u002Fdiv>\n          <div class=\"d\">샌드박스 채점에 더해 LLM-as-Judge가 정답 여부를 샅샅이 판정합니다.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card pillar\">\n          <div class=\"k\">Trust<\u002Fdiv>\n          <div class=\"t\">안전한 채점<\u002Fdiv>\n          <div class=\"d\">표절 검사와 할루시네이션 점수 추적으로 판정의 신뢰도를 보장합니다.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card pillar\">\n          <div class=\"k\">Guide<\u002Fdiv>\n          <div class=\"t\">막힘 없는 학습<\u002Fdiv>\n          <div class=\"d\">문제별 AI 튜터가 코드를 읽고 다음 한 걸음을 짚어줍니다.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"pageno num\">03 / 09<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 4 · AI ENSEMBLE -->\n  <section data-label=\"AI 심사위원단\" class=\"s-white\">\n    <div class=\"head\">\n      <div class=\"eyebrow\">AI Judge Ensemble<\u002Fdiv>\n      <h2 class=\"s-title\">정답을 넘어, 의도까지 샅샅이 검증<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"magi\">\n      <div class=\"card judge\">\n        <div class=\"nm\">Melchior<\u002Fdiv>\n        <div class=\"role\">풀이가 문제의 의도에 부합하는지 1차 판단<\u002Fdiv>\n        <div class=\"vote ac\">✓ AC<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card judge\">\n        <div class=\"nm\">Balthasar<\u002Fdiv>\n        <div class=\"role\">엣지 케이스·꼼수 통과 가능성을 교차 검증<\u002Fdiv>\n        <div class=\"vote ac\">✓ AC<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card judge\">\n        <div class=\"nm\">Casper<\u002Fdiv>\n        <div class=\"role\">세 모델의 합의로 AC / SUS 다수결 판정<\u002Fdiv>\n        <div class=\"vote sus\">🤔 SUS<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"proc\">\n      <span class=\"proc-step\">테스트 케이스 통과<\u002Fspan>\n      <span class=\"proc-arrow\">→<\u002Fspan>\n      <span class=\"proc-step\">3-모델 교차 검증<\u002Fspan>\n      <span class=\"proc-arrow\">→<\u002Fspan>\n      <span class=\"proc-step\">AC / SUS 다수결 판정<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"tutor-note\">\n      <span class=\"chip\">🤖 AI 튜터<\u002Fspan>\n      <span class=\"tutor-d\">막혔을 때는 문제별 AI 튜터가 코드를 읽고 다음 한 걸음을 짚어줍니다.<\u002Fspan>\n    <\u002Fdiv>\n    <div class=\"pageno num\">04 / 09<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 5 · LLM-as-JUDGE SAFEGUARDS -->\n  <section data-label=\"LLM-as-Judge\">\n    <div class=\"head\">\n      <div class=\"eyebrow\">LLM-as-Judge<\u002Fdiv>\n      <h2 class=\"s-title\">믿을 수 있는 AI 채점을 위한 안전장치<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"guard\">\n      <div class=\"card guard-card\">\n        <div class=\"g-h\">표절 검사<\u002Fdiv>\n        <div class=\"g-d\">제출 코드 간 유사도를 비교해 복제·표절 풀이를 가려냅니다.<\u002Fdiv>\n        <div class=\"meter\"><div class=\"meter-fill\" style=\"width:86%;background:var(--sus);\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"g-meta\" style=\"color:var(--sus);\">유사도 0.86 · 표절 의심<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card guard-card\">\n        <div class=\"g-h\">할루시네이션 점수 추적<\u002Fdiv>\n        <div class=\"g-d\">LLM 심사가 근거 없이 판단하지 않도록 할루시네이션 점수를 측정·기록합니다.<\u002Fdiv>\n        <div class=\"meter\"><div class=\"meter-fill\" style=\"width:8%;background:var(--brand);\"><\u002Fdiv><\u002Fdiv>\n        <div class=\"g-meta\" style=\"color:var(--brand);\">H-Score 0.08 · 안정<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"card guard-card\">\n        <div class=\"g-h\">판정 근거 로그<\u002Fdiv>\n        <div class=\"g-d\">모든 AC / SUS 결정의 근거를 남겨 언제든 재검토할 수 있습니다.<\u002Fdiv>\n        <div class=\"logbox\">&gt; plagiarism: <span class=\"bad\">0.86<\u002Fspan><br>&gt; hallucination: <span class=\"ok\">0.08<\u002Fspan><br>&gt; verdict: <span class=\"bad\">SUS<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"pageno num\">05 / 09<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 6 · AUTHORING ENGINE -->\n  <section data-label=\"출제 엔진\" class=\"s-white\">\n    <div class=\"head\">\n      <div class=\"eyebrow\">Authoring Engine · LangGraph<\u002Fdiv>\n      <h2 class=\"s-title\">스스로 만들고, 풀고, 공격을 막아난 문제만 출제<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"auth\">\n      <div class=\"pipe\">\n        <div class=\"node\"><div class=\"dot\">1<\u002Fdiv><div class=\"nl\">적재<\u002Fdiv><\u002Fdiv>\n        <div class=\"pl-arrow\">→<\u002Fdiv>\n        <div class=\"node\"><div class=\"dot\">2<\u002Fdiv><div class=\"nl\">검색<\u002Fdiv><\u002Fdiv>\n        <div class=\"pl-arrow\">→<\u002Fdiv>\n        <div class=\"node key\"><div class=\"dot\">3<\u002Fdiv><div class=\"nl\">생성<\u002Fdiv><\u002Fdiv>\n        <div class=\"pl-arrow\">→<\u002Fdiv>\n        <div class=\"node\"><div class=\"dot\">4<\u002Fdiv><div class=\"nl\">검증<\u002Fdiv><\u002Fdiv>\n        <div class=\"pl-arrow\">→<\u002Fdiv>\n        <div class=\"node\"><div class=\"dot\">5<\u002Fdiv><div class=\"nl\">심사<\u002Fdiv><\u002Fdiv>\n        <div class=\"pl-arrow\">→<\u002Fdiv>\n        <div class=\"node key\"><div class=\"dot\">6<\u002Fdiv><div class=\"nl\">풀이<\u002Fdiv><\u002Fdiv>\n        <div class=\"pl-arrow\">→<\u002Fdiv>\n        <div class=\"node key\"><div class=\"dot\">7<\u002Fdiv><div class=\"nl\">공격<\u002Fdiv><\u002Fdiv>\n        <div class=\"pl-arrow\">→<\u002Fdiv>\n        <div class=\"node\"><div class=\"dot\">8<\u002Fdiv><div class=\"nl\">비교<\u002Fdiv><\u002Fdiv>\n        <div class=\"pl-arrow\">→<\u002Fdiv>\n        <div class=\"node\"><div class=\"dot\">9<\u002Fdiv><div class=\"nl\">승인<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"auth-cards\">\n        <div class=\"card auth-card\">\n          <div class=\"ac-k\">Generate<\u002Fdiv>\n          <div class=\"ac-t\">스스로 생성<\u002Fdiv>\n          <div class=\"ac-d\">같은 카테고리의 모범 사례를 참고(RAG)해 새로운 변형 문제를 직접 만들어냅니다.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card auth-card\">\n          <div class=\"ac-k\">Solve<\u002Fdiv>\n          <div class=\"ac-t\">자가 풀이<\u002Fdiv>\n          <div class=\"ac-d\">세 LLM이 직접 문제를 풀어, 정답과 테스트가 성립하는지 검증합니다.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card auth-card\">\n          <div class=\"ac-k\">Attack<\u002Fdiv>\n          <div class=\"ac-t\">공격 방어<\u002Fdiv>\n          <div class=\"ac-d\">일부러 결함 있는 공격 코드를 던져, 테스트가 막아내는 문제만 통과시킵니다.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"pageno num\">06 / 09<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 7 · ARCHITECTURE -->\n  <section data-label=\"시스템 구성\">\n    <div class=\"head\">\n      <div class=\"eyebrow\">System<\u002Fdiv>\n      <h2 class=\"s-title\">네 개의 서비스로 구성<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"arch\">\n      <div class=\"arch-grid\">\n        <div class=\"card svc\">\n          <div class=\"layer\">Frontend<\u002Fdiv>\n          <div class=\"nm\">학생 웹 앱<\u002Fdiv>\n          <div class=\"stk\">Vite · React · TypeScript<\u002Fdiv>\n          <div class=\"d\">문제 · 솔버 · 결과 · 마이페이지 화면<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card svc\">\n          <div class=\"layer\">Backend<\u002Fdiv>\n          <div class=\"nm\">API 서버<\u002Fdiv>\n          <div class=\"stk\">FastAPI<\u002Fdiv>\n          <div class=\"d\">인증 · 문제 · 제출 · 채점 결과 관리<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card svc\">\n          <div class=\"layer\">Judge Engine<\u002Fdiv>\n          <div class=\"nm\">채점 엔진<\u002Fdiv>\n          <div class=\"stk\">Sandbox · LLM-as-Judge<\u002Fdiv>\n          <div class=\"d\">테스트 실행 + 표절·할루시네이션 검사 + 의도 판정<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card svc\">\n          <div class=\"layer\">Authoring Engine<\u002Fdiv>\n          <div class=\"nm\">문제 저작<\u002Fdiv>\n          <div class=\"stk\">LangGraph<\u002Fdiv>\n          <div class=\"d\">문제 · 테스트 · 해설 생성 파이프라인<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"slug\">JCodeQuest<\u002Fdiv>\n    <div class=\"pageno num\">07 / 09<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 8 · ROADMAP -->\n  <section data-label=\"향후 계획\" class=\"s-white\">\n    <div class=\"head\">\n      <div class=\"eyebrow\">Roadmap<\u002Fdiv>\n      <h2 class=\"s-title\">향후 계획<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"road\">\n      <div class=\"road-row\">\n        <div class=\"road-items\">\n          <div class=\"road-h\">교내 정식 운영 · 강의 연계<\u002Fdiv>\n          <div class=\"road-d\">주차별 문제를 실제 수업과 연동하고, 제출 데이터로 채점 정확도를 다듬습니다.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"road-row\">\n        <div class=\"road-items\">\n          <div class=\"road-h\">표절·할루시네이션 검사 고도화<\u002Fdiv>\n          <div class=\"road-d\">유사도 모델과 근거 검증을 강화해 LLM-as-Judge의 신뢰도를 끌어올립니다.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"road-row\">\n        <div class=\"road-items\">\n          <div class=\"road-h\">타 학문으로 영역 확장<\u002Fdiv>\n          <div class=\"road-d\">코딩을 넘어 수학 등 타 학문 문제까지 다루도록 문제 은행과 채점 영역을 넓힙니다.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"pageno num\">08 / 09<\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 9 · CLOSING -->\n  <section data-label=\"마무리\" class=\"close s-white\">\n    <h2 class=\"close-h\">J<span class=\"q\">CodeQuest<\u002Fspan><\u002Fh2>\n    <div class=\"team-line\">CodeQuest 팀<\u002Fdiv>\n    <div class=\"event-line\">전북대학교 AI SW경진대회<\u002Fdiv>\n    <div class=\"pageno num\">09 / 09<\u002Fdiv>\n  <\u002Fsection>\n\n<\u002Fdeck-stage>\n\n<script src=\"ced015b1-c4bb-4748-bdc9-800cb200c33b\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
